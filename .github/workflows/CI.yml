name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  pip:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Linux)
      run: sudo apt-get install gfortran libopenmpi-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install mpi4py

    - name: Install pypolychord
      run: pip install -v .

    - name: Test pypolychord
      run: python run_pypolychord.py

    - name: Test pypolychord (MPI)
      run: mpirun --oversubscribe -np 3 python run_pypolychord.py

    - name: Test pypolychord (anesthetic)
      run: |
        pip install -r requirements.txt
        python run_pypolychord.py


  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Linux)
      run: sudo apt-get install gfortran libopenmpi-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install mpi4py pytest fortranformat anesthetic

    - name: Install pypolychord
      run: pip install -v '.[test]'

    - name: Test pypolychord (no MPI)
      run: python -m pytest tests

    - name: Test pypolychord (MPI)
      run: mpirun --oversubscribe -np 3 python -m pytest tests


  make:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies (Linux)
      run: sudo apt-get install gfortran libopenmpi-dev

    - name: Build libraries
      run: make

    - name: Build fortran driver
      run: make polychord_fortran

    - name: Build C++ drivers
      run: make polychord_CC polychord_CC_ini

    - name: Build examples
      run: make examples

    - name: Run gaussian example
      run: ./bin/gaussian ini/gaussian.ini
